name: CI — evals & tests

# O GitHub Actions e um wrapper OPCIONAL. A fonte de verdade da CI e
# scripts/ci-local.sh, que roda no Docker da VPS pessoal via cron
# (ver docs/CI-LOCAL.md). Este arquivo existe para portabilidade: se algum
# dia quiser rodar no GitHub de novo, e a mesma verificacao, nada a duplicar.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: local-ci (mesmo script da VPS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Python deps
        run: python3 -m pip install --quiet numpy pyyaml

      - name: Run CI (scripts/ci-local.sh)
        run: ./scripts/ci-local.sh
