<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120">
  <!-- LLMFoundry logo — a forge/anvil mark for AI engineering -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Anvil silhouette -->
  <path d="M40 70 L40 90 Q40 96 46 96 L110 96 Q116 96 116 90 L116 70 Z" fill="url(#grad)"/>
  <rect x="28" y="58" width="100" height="12" rx="3" fill="url(#grad)"/>
  <!-- Hammer -->
  <rect x="130" y="52" width="10" height="48" rx="3" fill="#334155"/>
  <rect x="118" y="46" width="34" height="12" rx="3" fill="#334155"/>
  <!-- Spark -->
  <circle cx="160" cy="38" r="4" fill="#fbbf24"/>
  <circle cx="176" cy="26" r="2.5" fill="#f59e0b"/>
  <circle cx="186" cy="14" r="1.5" fill="#f59e0b"/>

  <!-- Text -->
  <text x="210" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#e2e8f0">LLM</text>
  <text x="298" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="url(#grad)">Foundry</text>
  <text x="210" y="78" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#64748b" letter-spacing="1">AI ENGINEERING KIT · DEEPSEEK</text>
</svg>
